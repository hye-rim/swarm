<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>괴물 서바이벌</title>
<style>
  /* 아이폰 사파리: 길게 눌러 복사 메뉴가 뜨거나 글자가 선택되지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px 8px; }
  #wrap { position:relative; background:#000; touch-action:none; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  /* 창 안의 글자·버튼은 게임 화면 크기에 비례한다 (--s = 화면 너비 / 240) */
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(8px * var(--s,1)); text-align:center; padding:calc(10px * var(--s,1)); background:rgba(10,6,20,.9); overflow:hidden; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:calc(26px * var(--s,1)); font-weight:900; letter-spacing:.02em; color:#c58aff; text-shadow:0 calc(2px * var(--s,1)) 0 #3a1a6a; line-height:1.15; }
  #overlay h2 { font-size:calc(20px * var(--s,1)); font-weight:900; }
  #overlay p { font-size:calc(11px * var(--s,1)); color:#e6e6e6; line-height:1.55; }
  #overlay p b { color:#ffd23a; font-weight:700; }
  #overlay .big { font-size:calc(24px * var(--s,1)); font-weight:900; color:#ffd23a; }
  #overlay button { background:linear-gradient(180deg,#e8d0ff,#9a5ae8); color:#240a40; font-weight:900; font-size:calc(14px * var(--s,1)); border:none; border-radius:999px; padding:calc(8px * var(--s,1)) calc(22px * var(--s,1)); box-shadow:0 calc(3px * var(--s,1)) 0 #4a1a8a; cursor:pointer; }
  #overlay button:active { transform:translateY(2px); box-shadow:0 1px 0 #4a1a8a; }
  #overlay button.sub { background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.3); font-size:calc(12px * var(--s,1)); padding:calc(6px * var(--s,1)) calc(14px * var(--s,1)); }
  #overlay .row { display:flex; gap:calc(8px * var(--s,1)); justify-content:center; flex-wrap:wrap; }
  #overlay .cards { display:flex; flex-direction:column; gap:calc(6px * var(--s,1)); width:94%; }
  #overlay .card { display:flex; align-items:center; gap:calc(10px * var(--s,1)); text-align:left; background:linear-gradient(180deg,#3a2a5a,#241840); color:#fff; border:2px solid #7a5ac8; border-radius:calc(10px * var(--s,1)); padding:calc(7px * var(--s,1)) calc(10px * var(--s,1)); box-shadow:none; font-weight:700; width:100%; }
  #overlay .card:active { transform:scale(.98); }
  #overlay .card .ico { font-size:calc(26px * var(--s,1)); width:calc(34px * var(--s,1)); text-align:center; }
  #overlay .card .nm { font-size:calc(13px * var(--s,1)); }
  #overlay .card .nm small { color:#ffd23a; margin-left:calc(6px * var(--s,1)); font-size:calc(10px * var(--s,1)); }
  #overlay .card .ds { font-size:calc(10px * var(--s,1)); color:#cfc0ee; font-weight:500; line-height:1.4; }
  #overlay .card.new { border-color:#ffd23a; }
  #overlay .opt { padding:calc(5px * var(--s,1)) calc(14px * var(--s,1)); font-size:calc(12px * var(--s,1)); background:rgba(255,255,255,.14); color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,.3); }
  #top { position:absolute; right:3px; top:20px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:calc(26px * var(--s,1)); height:calc(26px * var(--s,1)); border-radius:8px; font-size:calc(11px * var(--s,1)); cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  .pc { display:none; }
  @media (pointer:fine) { .pc { display:inline; } .touch { display:none; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
